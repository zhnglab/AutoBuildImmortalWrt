name: Build MzWrt x86 24.10.x

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择 ImmortalWrt 24.10 版本"
        required: true
        default: "24.10.6"
        type: choice
        options:
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6
      custom_router_ip:
        description: "多网口设备的 LAN 管理地址；单网口设备自动使用 DHCP"
        required: true
        default: "192.168.88.1"
      profile:
        description: "固件根分区大小（MB）"
        required: true
        default: "1024"
      include_docker:
        description: "是否集成 Docker"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      enable_pppoe:
        description: "是否预设 PPPoE"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"
      pppoe_account:
        description: "宽带账号（启用 PPPoE 时填写）"
        required: false
      pppoe_password:
        description: "宽带密码（启用 PPPoE 时填写）"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout x86 branch
        uses: actions/checkout@v6

      - name: Validate and prepare settings
        shell: bash
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]] && [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
            echo "PPPoE 已启用，但账号或密码为空。"
            exit 1
          fi
          if ! [[ "${{ inputs.profile }}" =~ ^[0-9]+$ ]] || (( ${{ inputs.profile }} < 512 )); then
            echo "固件大小必须是大于等于 512 的整数。"
            exit 1
          fi
          chmod +x x86-64/build24.sh
          mkdir -p custom
          printf '%s\n' "${{ inputs.custom_router_ip }}" > custom/custom_router_ip.txt

      - name: Build MzWrt x86 24.10
        shell: bash
        run: |
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/imm.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build24.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE="${{ inputs.profile }}" \
            -e INCLUDE_DOCKER="${{ inputs.include_docker }}" \
            -e ENABLE_PPPOE="${{ inputs.enable_pppoe }}" \
            -e PPPOE_ACCOUNT="${{ inputs.pppoe_account }}" \
            -e PPPOE_PASSWORD="${{ inputs.pppoe_password }}" \
            "immortalwrt/imagebuilder:x86-64-openwrt-${{ inputs.luci_version }}" \
            /bin/bash /home/build/immortalwrt/build.sh

      - name: Verify MzWrt packages
        shell: bash
        run: |
          manifest=$(find bin/targets/x86/64 -type f -name '*.manifest' | head -n1)
          test -n "$manifest" || { echo "没有生成 manifest"; exit 1; }
          for package in luci-app-store luci-app-openclash luci-app-passwall luci-app-turboacc luci-app-partexp luci-theme-argon; do
            grep -E "^${package}([[:space:]]|$)" "$manifest" || { echo "固件缺少 ${package}"; exit 1; }
          done

      - name: Rename firmware as MzWrt
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" bin/targets/x86/64
          source_file=$(find bin/targets/x86/64 -maxdepth 1 -type f -name '*squashfs-combined-efi.img.gz' | head -n1)
          test -n "$source_file" || { echo "没有找到 x86 EFI 固件"; exit 1; }
          target="bin/targets/x86/64/MzWrt-${{ inputs.luci_version }}-x86-64-squashfs-combined-efi.img.gz"
          mv "$source_file" "$target"

      - name: Create release information
        shell: bash
        run: |
          cat > router-info.md <<EOF
          # MzWrt x86 ${{ inputs.luci_version }} by Mr.Zhang
          - 包管理器：IPK / opkg
          - 多网口后台地址：${{ inputs.custom_router_ip }}
          - 单网口模式：DHCP 客户端
          - 用户名：root
          - 默认密码：无
          - SSH 标识：MzWrt by Mr.Zhang
          - LuCI 固件签名：ImmortalWrt ${{ inputs.luci_version }} By Mr.Zhang
          - 默认插件：iStore、OpenClash、PassWall、TurboACC、Argon、分区扩容
          EOF

      - name: Publish MzWrt firmware
        uses: softprops/action-gh-release@v3
        with:
          tag_name: MzWrt-x86-${{ inputs.luci_version }}
          name: MzWrt x86 ${{ inputs.luci_version }} by Mr.Zhang
          body_path: router-info.md
          files: bin/targets/x86/64/MzWrt-*.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
